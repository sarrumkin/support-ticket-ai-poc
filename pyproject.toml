[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hub-support-poc"
version = "0.1.0"
description = "Minimal replaceable ML tracer for support ticket routing"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "groq>=1.6,<2",
    "pydantic>=2.13,<3",
    "qdrant-client[fastembed]>=1.19,<2",
    "scikit-learn>=1.9,<2",
    "scrubadub>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=9,<10"]

[project.scripts]
support-poc-demo = "support_poc.demo:main"
support-poc-scenarios = "support_poc.scenarios:main"

[tool.setuptools.package-data]
support_poc = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "semantic: downloads and runs the local embedding model",
    "groq: calls the external Groq API with synthetic redacted data",
]
